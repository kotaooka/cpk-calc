# プッシュ時に統計計算・Excel 入出力のテストと、解説の埋め込みが最新かを確認する
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # markdown は版で太字の解釈が変わることがあるため固定する（上げるときは tools/build.py を作り直してから）
      - run: pip install markdown==3.11.1 openpyxl numpy scipy pandas
      - name: 解説（docs/explanation.md）の埋め込みが最新か
        run: python tools/build.py && git diff --exit-code index.html
      - name: 統計計算・Excel 入出力のテスト（コミット済みの参照値）
        run: node tests/test.js
      - name: NIST の認証値・数値例との照合
        run: node tests/published.js
      - name: 最新の scipy で参照値を作り直して再テスト
        run: python tests/make_reference.py && node tests/test.js
